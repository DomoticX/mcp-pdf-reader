services:
  mcp-pdf-reader:
    build: .
    image: mcp-pdf-reader:latest
    container_name: mcp-pdf-reader
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # PDFs to read, read-only. Reference them from MCP clients as /data/<file>.pdf
      - ./pdfs:/data:ro
      # Rendered page PNGs, kept across restarts.
      - ./temp:/app/temp
    # command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
